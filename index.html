<!DOCTYPE html>
<html lang="ja">
<head>
<link rel="apple-touch-icon" href="icon-haouden.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>年号覇王伝</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html {
  font-size: 16px;
}

body {
  margin: 0;
  padding: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;
  background: #f2f5fa;
  color: #222;
  -webkit-text-size-adjust: 100%;
}

/* =========================
   ヘッダー
========================= */

header {
  background: linear-gradient(135deg, #315efb, #6846d9);
  color: white;
  padding:
    calc(18px + env(safe-area-inset-top))
    15px
    20px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 25px;
  line-height: 1.3;
}

header p {
  margin: 7px 0 0;
  font-size: 14px;
}

/* =========================
   全体
========================= */

.container {
  width: 100%;
  max-width: 650px;
  margin: 0 auto;
  padding: 12px;
  padding-bottom: 35px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 18px 15px;
  margin-bottom: 14px;
  box-shadow: 0 3px 14px rgba(0,0,0,.08);
}

/* =========================
   見出し
========================= */

h2 {
  font-size: 20px;
  margin:
    0 0 15px;
}

/* =========================
   入力
========================= */

label {
  display: block;
  font-weight: bold;
  font-size: 16px;
  margin-top: 16px;
  margin-bottom: 7px;
}

select,
input {
  width: 100%;
  min-height: 52px;
  padding: 12px 13px;
  border: 1.5px solid #cbd3df;
  border-radius: 12px;
  background: white;
  color: #222;
  font-size: 17px;
  appearance: auto;
}

input:focus,
select:focus {
  outline: 3px solid rgba(49,94,251,.18);
  border-color: #315efb;
}

/* =========================
   ボタン
========================= */

button {
  width: 100%;
  min-height: 54px;
  border: none;
  border-radius: 13px;
  padding: 13px 12px;
  margin-top: 10px;
  font-size: 17px;
  font-weight: bold;
  line-height: 1.35;
  cursor: pointer;
  touch-action: manipulation;
  transition:
    transform .08s,
    opacity .15s;
}

button:active {
  transform: scale(.97);
}

button:disabled {
  opacity: .75;
}

.startBtn {
  background: #315efb;
  color: white;
  box-shadow: 0 3px 7px rgba(49,94,251,.25);
}

.subBtn {
  background: #edf1ff;
  color: #315efb;
}

.dangerBtn {
  background: #ffe9e9;
  color: #c22;
}

.backBtn {
  background: #eeeeee;
  color: #555;
}

/* =========================
   問題形式
========================= */

.modeBtns {
  display: grid;
  grid-template-columns: 1fr;
  gap: 9px;
}

.modeBtn {
  min-height: 58px;
  background: #eef1f6;
  color: #333;
  border: 2px solid transparent;
}

.modeBtn.selected {
  background: #315efb;
  color: white;
}

/* =========================
   問題画面
========================= */

.questionNo {
  font-size: 14px;
  font-weight: bold;
  color: #666;
  margin-bottom: 8px;
}

.question {
  font-size: 24px;
  font-weight: bold;
  line-height: 1.55;
  text-align: center;
  padding:
    12px 5px
    18px;
  word-break: break-word;
}

/* =========================
   進捗バー
========================= */

.progress {
  width: 100%;
  height: 10px;
  background: #e3e7ee;
  border-radius: 20px;
  overflow: hidden;
  margin: 7px 0 12px;
}

.progressBar {
  height: 100%;
  background: #315efb;
  width: 0%;
  transition: width .3s ease;
}

/* =========================
   年号入力
========================= */

.answerInput {
  width: 100%;
  height: 65px;
  min-height: 65px;
  font-size: 30px;
  font-weight: bold;
  text-align: center;
  border: 2px solid #bfc8d8;
  border-radius: 14px;
  margin-top: 5px;
}

.answerInput::placeholder {
  font-size: 17px;
  font-weight: normal;
  color: #999;
}

/* =========================
   6択
========================= */

.sixChoices {
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.choice {
  width: 100%;
  min-height: 64px;
  margin: 0;
  padding: 12px 14px;
  background: #f4f6fa;
  border: 2px solid #dce1e9;
  color: #222;
  text-align: left;
  font-size: 16px;
  font-weight: 600;
  border-radius: 13px;
}

.choice:active {
  background: #e9edff;
}

.choice.correct {
  background: #d8f7df;
  border-color: #39a852;
  color: #176b29;
}

.choice.wrong {
  background: #ffdcdc;
  border-color: #e33;
  color: #a51d1d;
}

/* =========================
   結果表示
========================= */

.result {
  padding: 16px;
  border-radius: 13px;
  margin-top: 14px;
  font-size: 19px;
  line-height: 1.5;
  text-align: center;
}

.correctResult {
  background: #e1f7e6;
  color: #176b29;
}

.wrongResult {
  background: #ffe2e2;
  color: #a51d1d;
}

/* =========================
   語呂合わせ
========================= */

.goro {
  background: #fff8d9;
  border-left: 5px solid #f1c40f;
  padding: 14px;
  margin-top: 12px;
  border-radius: 9px;
  font-size: 16px;
  line-height: 1.55;
}

.goroTitle {
  font-size: 17px;
  font-weight: bold;
  margin-bottom: 5px;
}

/* =========================
   解説
========================= */

.explanation {
  margin-top: 12px;
  padding: 12px;
  background: #f6f7f9;
  border-radius: 10px;
  font-size: 14px;
  line-height: 1.7;
}

/* =========================
   スコア
========================= */

.score {
  text-align: center;
  font-size: 48px;
  font-weight: 900;
  margin: 15px 0;
}

.statGrid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 7px;
  text-align: center;
}

.statBox {
  background: #f2f4f8;
  border-radius: 12px;
  padding: 12px 4px;
}

.statNumber {
  font-size: 25px;
  font-weight: 900;
  margin-bottom: 3px;
}

/* =========================
   ランク
========================= */

.rankA {
  color: #d33;
}

.rankB {
  color: #d88a00;
}

.rankC {
  color: #4878c9;
}

/* =========================
   小さい文字
========================= */

.small {
  font-size: 13px;
  color: #777;
  line-height: 1.5;
}

/* =========================
   スマホ用
========================= */

@media (max-width: 480px) {

  .container {
    padding: 10px;
  }

  .card {
    padding: 16px 12px;
    border-radius: 16px;
  }

  header h1 {
    font-size: 23px;
  }

  .question {
    font-size: 23px;
  }

  .choice {
    min-height: 67px;
    font-size: 16px;
  }

  button {
    min-height: 56px;
    font-size: 17px;
  }

  .statGrid {
    gap: 5px;
  }

  .statBox {
    font-size: 13px;
  }

  .statNumber {
    font-size: 23px;
  }
}

/* =========================
   横向き対策
========================= */

@media (orientation: landscape) and (max-height: 500px) {

  header {
    padding-top: 10px;
    padding-bottom: 10px;
  }

  .card {
    padding: 12px;
  }

  .question {
    font-size: 20px;
    padding: 5px;
  }

  button {
    min-height: 46px;
  }
}

/* =========================
   クイズ画面を大きく表示
========================= */

.quiz-fullscreen {
  width: 100%;
  max-width: 1100px;
  margin: 0 auto;
  min-height: 100vh;
  padding: 20px;
}

.quiz-fullscreen .card {
  width: 100%;
  padding: 25px;
}

.quiz-fullscreen .question {
  font-size: 32px;
  padding: 25px 10px;
}

.quiz-fullscreen .choice {
  min-height: 72px;
  font-size: 19px;
}

.quiz-fullscreen .answerInput {
  height: 75px;
  min-height: 75px;
  font-size: 34px;
}

.quiz-fullscreen button {
  min-height: 62px;
  font-size: 19px;
}

/* スマホ */

@media (max-width: 600px) {

  .quiz-fullscreen {
    width: 100%;
    padding: 8px;
  }

  .quiz-fullscreen .card {
    padding: 18px 12px;
  }

  .quiz-fullscreen .question {
    font-size: 27px;
  }

  .quiz-fullscreen .choice {
    min-height: 70px;
    font-size: 17px;
  }

  .quiz-fullscreen button {
    min-height: 60px;
    font-size: 18px;
  }
}

/* =========================
   戻るボタン
========================= */

.quizBackButton {
  background: #eeeeee;
  color: #555;
  margin-bottom: 10px;
}

.hidden {
  display: none !important;
}

footer {
  text-align: center;
  padding: 20px;
  color: #777;
  font-size: 13px;
}
</style>
</head>

<body>

<header>
  <h1> ⚔️年号覇王伝</h1>
  <p>出来事 → 年号 ／ 年号 → 6択</p>
</header>

<div class="container">

<!-- =========================
     設定画面
========================= -->

<div id="setup" class="card">

  <h2>🎯 出題設定</h2>

  <label>時代</label>

  <select id="era">
    <option value="all">すべて</option>
    <option value="弥生">弥生</option>
    <option value="古墳">古墳</option>
    <option value="飛鳥">飛鳥時代</option>
    <option value="奈良">奈良時代</option>
    <option value="平安">平安時代</option>
    <option value="鎌倉">鎌倉時代</option>
    <option value="室町">室町時代</option>
    <option value="安土桃山">安土・桃山時代</option>
    <option value="江戸">江戸時代</option>
    <option value="明治">明治時代</option>
    <option value="大正">大正時代</option>
    <option value="昭和">昭和時代</option>
  </select>

  <label>問題番号</label>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
    <input type="number" id="startNo" value="1" min="1">
    <input type="number" id="endNo" value="999" min="1">
  </div>

  <p class="small">
    例：1〜30なら「1」と「30」
  </p>

  <label>ランク</label>

  <select id="rank">
    <option value="all">A・B・Cすべて</option>
    <option value="A">Aだけ</option>
    <option value="B">Bだけ</option>
    <option value="C">Cだけ</option>
  </select>

  <label>問題数</label>

  <select id="questionCount">
    <option value="5">5問</option>
    <option value="10" selected>10問</option>
    <option value="20">20問</option>
    <option value="30">30問</option>
    <option value="50">50問</option>
    <option value="all">全部</option>
  </select>

  <label>問題形式</label>

  <div class="modeBtns">

    <button
      class="modeBtn selected"
      id="modeYearBtn"
      onclick="selectMode('year')">
      ✍️ 出来事 → 年号
    </button>

    <button
      class="modeBtn"
      id="modeEventBtn"
      onclick="selectMode('event')">
      🔢 年号 → 6択
    </button>

  </div>

  <button class="startBtn" onclick="startQuiz(false)">
    🚀 クイズ開始
  </button>

  <button class="subBtn" onclick="startQuiz(true)">
    ❌ 間違えた問題だけ
  </button>

  <button class="subBtn" onclick="showStats()">
    📊 苦手ランキングを見る
  </button>

  <button class="dangerBtn" onclick="resetWrong()">
    🗑 苦手記録をリセット
  </button>

</div>


<!-- =========================
     クイズ画面
========================= -->

<div id="quiz" class="hidden quiz-fullscreen">

  <button
    class="quizBackButton"
    onclick="confirmBackToSetup()">
    ↩️ 途中で設定に戻る
  </button>

  <div class="card">

    <div class="questionNo" id="questionNo"></div>

    <div class="progress">
      <div
        class="progressBar"
        id="progressBar">
      </div>
    </div>

    <div id="question" class="question"></div>

    <div id="answerArea"></div>

    <div id="resultArea"></div>

  </div>

</div>


<!-- =========================
     結果画面
========================= -->

<div id="resultScreen" class="hidden">

  <div class="card">

    <h2>🎉 結果発表</h2>

    <div class="score" id="finalScore"></div>

    <div class="statGrid">

      <div class="statBox">
        <div class="statNumber" id="correctCount">0</div>
        正解
      </div>

      <div class="statBox">
        <div class="statNumber" id="wrongCount">0</div>
        不正解
      </div>

      <div class="statBox">
        <div class="statNumber" id="percent">0%</div>
        正解率
      </div>

    </div>

    <button class="startBtn" onclick="backToSetup()">
      🔄 もう一度設定
    </button>

    <button class="subBtn" onclick="retryWrongFromResult()">
      ❌ 間違えた問題だけ復習
    </button>

  </div>

</div>


<!-- =========================
     統計
========================= -->

<div id="statsScreen" class="hidden">

  <div class="card">

    <h2>📊 苦手ランキング</h2>

    <div id="statsList"></div>

    <button class="subBtn" onclick="backToSetup()">
      ← 戻る
    </button>

  </div>

</div>

</div>

<footer>
日本史 年号暗記クイズ
</footer>

/* =====================================================
   シャッフル
===================================================== */

function shuffle(array) {

  const a = [...array];

  for (let i = a.length - 1; i > 0; i--) {

    const j =
      Math.floor(Math.random() * (i + 1));

    [a[i], a[j]] =
      [a[j], a[i]];
  }

  return a;
}

===================================================== */

function startQuiz(wrongOnly) {

  let pool = questions;

  if (wrongOnly) {

    const wrongIds =
      JSON.parse(
        localStorage.getItem("wrongQuestions") || "[]"
      );

    pool =
      questions.filter(
        q => wrongIds.includes(q.n)
      );

    if (pool.length === 0) {

      alert("まだ間違えた問題がありません！");

      return;
    }

  } else {

    const era =
      document.getElementById("era").value;

    const startNo =
      Number(
        document.getElementById("startNo").value
      ) || 1;

    const endNo =
      Number(
        document.getElementById("endNo").value
      ) || questions.length;

    const rank =
      document.getElementById("rank").value;

    pool =
      questions.filter(q => {

        const eraOK =
          era === "all" || q.era === era;

        const numberOK =
          q.n >= startNo &&
          q.n <= endNo;

        const rankOK =
          rank === "all" ||
          q.rank === rank;

        return eraOK &&
               numberOK &&
               rankOK;
      });
  }


  if (pool.length === 0) {

    alert("条件に合う問題がありません。");

    return;
  }


  const count =
    document.getElementById("questionCount").value;


  if (count !== "all") {

    pool =
      shuffle(pool)
      .slice(0, Number(count));

  } else {

    pool =
      shuffle(pool);
  }


  quizQuestions = pool;

  currentIndex = 0;

  correct = 0;

  wrong = 0;

  wrongThisGame = [];


  document.getElementById("setup")
    .classList.add("hidden");

  document.getElementById("resultScreen")
    .classList.add("hidden");

  document.getElementById("statsScreen")
    .classList.add("hidden");

  document.getElementById("quiz")
    .classList.remove("hidden");


  showQuestion();
}


/* =====================================================
   問題表示
===================================================== */

function showQuestion() {

  const q =
    quizQuestions[currentIndex];


  document.getElementById("questionNo")
    .textContent =
      `第 ${currentIndex + 1} 問 / ${quizQuestions.length}問　【${q.rank}】`;


  document.getElementById("progressBar")
    .style.width =
      ((currentIndex) /
       quizQuestions.length * 100) + "%";


  document.getElementById("resultArea")
    .innerHTML = "";


  const question =
    document.getElementById("question");

  const answerArea =
    document.getElementById("answerArea");


  if (mode === "year") {

    question.innerHTML =
      `「${q.event}」<br>
       <span style="font-size:16px;color:#777;">
       何年？
       </span>`;


    answerArea.innerHTML = `

      <input
        id="yearAnswer"
        class="answerInput"
        type="number"
        inputmode="numeric"
        placeholder="年号を入力"
        onkeydown="
          if(event.key==='Enter')
          checkYearAnswer()
        "
      >

      <button
        class="startBtn"
        onclick="checkYearAnswer()">
        ✅ 答える
      </button>

    `;


    setTimeout(() => {

      const input =
        document.getElementById("yearAnswer");

      if (input) {
        input.focus();
      }

    }, 100);


  } else {

    question.innerHTML =
      `「${q.year}年」<br>
       <span style="font-size:16px;color:#777;">
       何が起こった？
       </span>`;


    makeChoices(q);
  }
}


/* =====================================================
   年号入力問題
===================================================== */

function checkYearAnswer() {

  const q =
    quizQuestions[currentIndex];

  const input =
    document.getElementById("yearAnswer");

  const answer =
    Number(input.value);


  if (!answer) {

    alert("年号を入力してください。");

    return;
  }


  const isCorrect =
    answer === q.year;


  if (isCorrect) {

    correct++;

    removeWrong(q.n);

    playCorrectSound();

  } else {

    wrong++;

    addWrong(q.n);

    wrongThisGame.push(q);

    playWrongSound();
  }


  input.disabled = true;

  showAnswerResult(
    q,
    isCorrect,
    answer
  );
}


/* =====================================================
   6択問題
===================================================== */

function makeChoices(q) {

  const otherEvents =
    shuffle(
      questions.filter(
        x => x.n !== q.n
      )
    ).slice(0, 5);


  const choices =
    shuffle([
      q,
      ...otherEvents
    ]);


  const area =
    document.getElementById("answerArea");


  area.innerHTML = `
    <div class="sixChoices" id="choices"></div>
  `;


  const choicesDiv =
    document.getElementById("choices");


  choices.forEach(choice => {

    const btn =
      document.createElement("button");


    btn.className = "choice";

    btn.textContent =
      choice.event;


    btn.onclick = () => {

      const allButtons =
        document.querySelectorAll(".choice");


      allButtons.forEach(b => {

        b.disabled = true;

      });


      const isCorrect =
        choice.n === q.n;


      if (isCorrect) {

        correct++;

        removeWrong(q.n);

        btn.classList.add("correct");

        playCorrectSound();

      } else {

        wrong++;

        addWrong(q.n);

        wrongThisGame.push(q);

        btn.classList.add("wrong");


        allButtons.forEach(b => {

          if (b.textContent === q.event) {

            b.classList.add("correct");

          }

        });


        playWrongSound();
      }


      showAnswerResult(
        q,
        isCorrect,
        choice.event
      );

    };


    choicesDiv.appendChild(btn);

  });
}


/* =====================================================
   正解・不正解表示
===================================================== */

function showAnswerResult(
  q,
  isCorrect,
  userAnswer
) {

  const area =
    document.getElementById("resultArea");


  const title =
    isCorrect
    ? "⭕ 正解！"
    : "❌ 不正解";


  const resultClass =
    isCorrect
    ? "correctResult"
    : "wrongResult";


  area.innerHTML = `

    <div class="result ${resultClass}">

      ${title}

      ${
        isCorrect
        ? ""
        : `<br>正解：${q.year}年`
      }

    </div>


    <div class="goro">

      <div class="goroTitle">
        💡 語呂合わせ
      </div>

      ${q.goro}

    </div>


    <div class="explanation">

      📖 出来事：
      ${q.event}
      <br>

      📅 年号：
      ${q.year}年
      <br>

      🏷 ランク：
      ${q.rank}

    </div>


    <button
      class="startBtn"
      onclick="nextQuestion()">

      ${
        currentIndex + 1 === quizQuestions.length
        ? "🏁 結果を見る"
        : "➡️ 次の問題"
      }

    </button>

  `;
}


/* =====================================================
   次の問題
===================================================== */

function nextQuestion() {

  currentIndex++;


  if (
    currentIndex >=
    quizQuestions.length
  ) {

    showFinalResult();

  } else {

    showQuestion();
  }
}


/* =====================================================
   途中で設定に戻る
===================================================== */

function confirmBackToSetup() {

  const ok =
    confirm(
      "クイズを途中で終了して設定画面に戻りますか？\n\n今回の途中経過は保存されません。"
    );


  if (!ok) return;


  document.getElementById("quiz")
    .classList.add("hidden");

  document.getElementById("setup")
    .classList.remove("hidden");
}


/* =====================================================
   結果
===================================================== */

function showFinalResult() {

  document.getElementById("quiz")
    .classList.add("hidden");


  document.getElementById("resultScreen")
    .classList.remove("hidden");


  const total =
    correct + wrong;


  const percent =
    total === 0
    ? 0
    : Math.round(
        correct / total * 100
      );


  document.getElementById("finalScore")
    .textContent =
      `${percent}%`;


  document.getElementById("correctCount")
    .textContent =
      correct;


  document.getElementById("wrongCount")
    .textContent =
      wrong;


  document.getElementById("percent")
    .textContent =
      percent + "%";


  playResultSound();
}


/* =====================================================
   苦手問題保存
===================================================== */

function addWrong(id) {

  let list =
    JSON.parse(
      localStorage.getItem(
        "wrongQuestions"
      ) || "[]"
    );


  if (!list.includes(id)) {

    list.push(id);
  }


  localStorage.setItem(
    "wrongQuestions",
    JSON.stringify(list)
  );


  updateWrongCount(
    id,
    true
  );
}


function removeWrong(id) {

  let list =
    JSON.parse(
      localStorage.getItem(
        "wrongQuestions"
      ) || "[]"
    );


  list =
    list.filter(
      x => x !== id
    );


  localStorage.setItem(
    "wrongQuestions",
    JSON.stringify(list)
  );


  updateWrongCount(
    id,
    false
  );
}


/* =====================================================
   間違い回数
===================================================== */

function updateWrongCount(
  id,
  wasWrong
) {

  let stats =
    JSON.parse(
      localStorage.getItem(
        "wrongStats"
      ) || "{}"
    );


  if (!stats[id]) {

    stats[id] = 0;
  }


  if (wasWrong) {

    stats[id]++;
  }


  localStorage.setItem(
    "wrongStats",
    JSON.stringify(stats)
  );
}


/* =====================================================
   苦手ランキング
===================================================== */

function showStats() {

  document.getElementById("setup")
    .classList.add("hidden");


  document.getElementById("statsScreen")
    .classList.remove("hidden");


  const stats =
    JSON.parse(
      localStorage.getItem(
        "wrongStats"
      ) || "{}"
    );


  const list =
    Object.entries(stats)
      .filter(
        ([id,count]) =>
          count > 0
      )
      .sort(
        (a,b) =>
          b[1] - a[1]
      );


  const area =
    document.getElementById(
      "statsList"
    );


  if (list.length === 0) {

    area.innerHTML =
      `<p>
        まだ間違えた問題はありません！🎉
      </p>`;

    return;
  }


  area.innerHTML = "";


  list.forEach(
    ([id,count], index) => {

      const q =
        questions.find(
          x =>
            x.n === Number(id)
        );


      if (!q) return;


      const div =
        document.createElement("div");


      div.className = "card";


      div.style.boxShadow =
        "none";

      div.style.background =
        "#f5f7fb";


      div.innerHTML = `

        <strong>
          ${index + 1}位　No.${q.n}
        </strong>

        <br>

        ${q.event}

        <br>

        <span class="small">

          ${q.year}年　【${q.rank}】　

          間違い ${count}回

        </span>

      `;


      area.appendChild(div);

    }
  );
}


/* =====================================================
   結果画面から苦手復習
===================================================== */

function retryWrongFromResult() {

  const wrongIds =
    JSON.parse(
      localStorage.getItem(
        "wrongQuestions"
      ) || "[]"
    );


  if (wrongIds.length === 0) {

    alert(
      "間違えた問題はありません！🎉"
    );

    return;
  }


  document.getElementById(
    "resultScreen"
  ).classList.add("hidden");


  mode =
    Math.random() < 0.5
    ? "year"
    : "event";


  startQuiz(true);
}


/* =====================================================
   設定画面へ
===================================================== */

function backToSetup() {

  document.getElementById("quiz")
    .classList.add("hidden");


  document.getElementById(
    "resultScreen"
  ).classList.add("hidden");


  document.getElementById(
    "statsScreen"
  ).classList.add("hidden");


  document.getElementById("setup")
    .classList.remove("hidden");
}


/* =====================================================
   苦手記録リセット
===================================================== */

function resetWrong() {

  if (
    confirm(
      "間違えた問題の記録を全部消しますか？"
    )
  ) {

    localStorage.removeItem(
      "wrongQuestions"
    );

    localStorage.removeItem(
      "wrongStats"
    );

    alert(
      "苦手記録をリセットしました！"
    );
  }
}


/* =====================================================
   音を作る
   和風・ゲーム風オリジナル効果音
===================================================== */

let audioCtx = null;


function getAudioContext() {

  const AudioContext =
    window.AudioContext ||
    window.webkitAudioContext;


  if (!AudioContext) {
    return null;
  }


  if (!audioCtx) {
    audioCtx =
      new AudioContext();
  }


  if (audioCtx.state === "suspended") {
    audioCtx.resume();
  }


  return audioCtx;
}


/* =====================================================
   1音
===================================================== */

function playNote(
  frequency,
  duration,
  type = "sine",
  volume = 0.12,
  delay = 0
) {

  const ctx =
    getAudioContext();


  if (!ctx) return;


  const oscillator =
    ctx.createOscillator();

  const gain =
    ctx.createGain();


  oscillator.type = type;

  oscillator.frequency.setValueAtTime(
    frequency,
    ctx.currentTime + delay
  );


  gain.gain.setValueAtTime(
    0.001,
    ctx.currentTime + delay
  );


  gain.gain.exponentialRampToValueAtTime(
    volume,
    ctx.currentTime + delay + 0.015
  );


  gain.gain.exponentialRampToValueAtTime(
    0.001,
    ctx.currentTime + delay + duration
  );


  oscillator.connect(gain);

  gain.connect(ctx.destination);


  oscillator.start(
    ctx.currentTime + delay
  );


  oscillator.stop(
    ctx.currentTime + delay + duration + 0.02
  );
}
